<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del Grupo</title>
    <style>
        :root {
            --bg-dark: #121212;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent-color: #bb86fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .group-number {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .team-members {
            display: grid;
            gap: 15px;
        }

        .member {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.3s ease;
        }

        .member:hover {
            transform: scale(1.03);
        }

        .member-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .member-details {
            color: var(--text-secondary);
            font-size: 0.98rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="group-number">
            Grupo #20
        </div>
        
        <div class="team-members">
            <div class="member">
                <div class="member-name">Brandon Andy Jefferson Tejaxún Pichiyá</div>
                <div class="member-details">202112030</div>
            </div>
            
            <div class="member">
                <div class="member-name">Jose Andres Hinestroza Garcia</div>
                <div class="member-details">202100316</div>
            </div>
            
            <div class="member">
                <div class="member-name">Joab Israel Ajsivinac Ajsivinac</div>
                <div class="member-details">202200135</div>
            </div>
            
        </div>
    </div>
</body>
</html>
